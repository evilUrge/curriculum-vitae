name: CV Quality Check (PDF + ATS Validation)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cv.html'
      - 'scripts/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  cv-quality-check:
    name: CV Quality Check (PDF + ATS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          npm ci --only=production
          echo "✅ Dependencies installed successfully"

      - name: Verify source files
        run: |
          echo "🔍 Verifying source files..."
          if [ ! -f "cv.html" ]; then
            echo "❌ cv.html not found!"
            exit 1
          fi
          echo "✅ cv.html found"

          if [ ! -f "scripts/generate-pdf.js" ]; then
            echo "❌ generate-pdf.js not found!"
            exit 1
          fi
          echo "✅ PDF generation script found"

          echo "🏗️  Node.js version: $(node --version)"
          echo "📦 NPM version: $(npm --version)"

      - name: Generate PDF
        run: |
          echo "🚀 Starting PDF generation..."
          node scripts/generate-pdf.js
          echo "✅ PDF generation completed"
        env:
          NODE_ENV: production
          CI: true

      - name: Validate generated PDF
        run: |
          echo "🔍 Validating generated PDF..."

          if [ ! -f "output/Gilad-Maoz-CV.pdf" ]; then
            echo "❌ PDF file not generated!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "output/Gilad-Maoz-CV.pdf" 2>/dev/null || stat -f%z "output/Gilad-Maoz-CV.pdf")
          FILE_SIZE_KB=$((FILE_SIZE / 1024))
          echo "📏 PDF size: ${FILE_SIZE_KB} KB"

          # Check if PDF is reasonable size
          if [ $FILE_SIZE -lt 10240 ]; then
            echo "❌ PDF file too small (< 10KB), likely corrupted"
            exit 1
          fi

          if [ $FILE_SIZE -gt 5242880 ]; then
            echo "⚠️  Warning: PDF file very large (> 5MB)"
          fi

          echo "✅ PDF validation completed successfully"

      - name: Run ATS & CAR Validation
        run: |
          echo "🤖 Running ATS & CAR Method validation..."
          node scripts/validate-ats.js

          # Capture exit code
          ATS_EXIT_CODE=$?

          if [ $ATS_EXIT_CODE -eq 0 ]; then
            echo "✅ ATS validation passed!"
          else
            echo "❌ ATS validation failed - see details above"
            exit 1
          fi

      - name: Upload PDF as PR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf-pr-${{ github.event.pull_request.number }}
          path: output/Gilad-Maoz-CV.pdf
          retention-days: 30
          compression-level: 0

      - name: Comment on PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileSizeBytes = fs.statSync('output/Gilad-Maoz-CV.pdf').size;
            const fileSizeKB = Math.round(fileSizeBytes / 1024);

            const comment = `## 📄 CV Quality Check Complete

            ✅ All validations passed!

            ### PDF Generation
            - 📏 **Size:** ${fileSizeKB} KB
            - 🔗 **Artifact:** \`cv-pdf-pr-${context.issue.number}\`
            - ⏱️ **Generated:** ${new Date().toISOString()}

            ### ATS Validation
            - ✅ **Score:** 80%+ (Passed)
            - ✅ **CAR Method:** Validated
            - ✅ **Keywords:** Optimized
            - ✅ **Format:** ATS-friendly

            ### Download Instructions
            1. Scroll to bottom of this PR
            2. Find "Checks" section
            3. Click on "CV Quality Check (PDF + ATS)"
            4. Download artifact: \`cv-pdf-pr-${context.issue.number}\`

            The PDF includes all experience sections with proper formatting and passes ATS requirements.

            ---
            🤖 *Auto-generated by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Summary
        if: always()
        run: |
          echo "## 📋 PDF Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "output/Gilad-Maoz-CV.pdf" ]; then
            FILE_SIZE=$(stat -c%s "output/Gilad-Maoz-CV.pdf" 2>/dev/null || stat -f%z "output/Gilad-Maoz-CV.pdf")
            FILE_SIZE_KB=$((FILE_SIZE / 1024))

            echo "✅ **PDF Generated Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "- 📁 **File**: \`output/Gilad-Maoz-CV.pdf\`" >> $GITHUB_STEP_SUMMARY
            echo "- 📏 **Size**: ${FILE_SIZE_KB} KB" >> $GITHUB_STEP_SUMMARY
            echo "- 🔢 **PR Number**: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🏷️  **Commit**: \`${{ github.event.pull_request.head.sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **PDF Generation Failed**" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
